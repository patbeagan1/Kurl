name: Kurl
description: A Kotlin DSL for Ktor that provides a curl-like interface for making HTTP requests, simplifying request construction and execution with a fluent API.
language: kotlin
tags:
  - kotlin
  - ktor
  - http-client
  - dsl
  - curl
release_branch: main
has_release_script: true
release_repo: patbeagan1/Kurl

scripts:
  build:
    command: "mvn package"
  test:
    command: "mvn test"
  release:
    command: "mvn clean dokka:javadocJar deploy -P deployment"

subtree:
  repo: git@github.com:patbeagan1/Kurl.git
  prefix: Kurl
  branch: develop

